name: Windows Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'

      - name: Configure
        run: cmake -B build -S . -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt DLLs
        run: |
          mkdir dist
          copy build\Release\WellTool.exe dist\
          windeployqt --release dist\WellTool.exe

      - name: Zip artifact
        run: Compress-Archive -Path dist\* -DestinationPath WellTool-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WellTool-windows
          path: WellTool-windows.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: WellTool-windows.zip
